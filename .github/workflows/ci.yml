name: CI Audit & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals-and-schema:
    name: Python WCAG & JSON Schema Evals
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install beautifulsoup4 jsonschema

      - name: Run Vibe UI Automated Verification (Human Readable)
        run: python evals/run_evals.py

      - name: Run Vibe UI Automated Verification (Machine-Readable JSON Mode)
        run: python evals/run_evals.py --json

      - name: Run BM25 & Design Intelligence Engine Self-Tests
        run: python vibe_core/search_engine.py

      - name: Run Inter-Agent Swarm Contracts Verification
        run: python scripts/test_agent_contracts.py

      - name: Run Advanced Quality, E2E Smoke & Anti-Slop Test Suite
        run: python scripts/test_advanced_quality.py

  vibe-ui-package-audit:
    name: NPM Package Distribution & CLI Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & build packages/vibe-ui-suite
        working-directory: packages/vibe-ui-suite
        run: |
          npm install
          npm run build

      - name: Verify CLI Execution & Help
        working-directory: packages/vibe-ui-suite
        run: |
          node dist/cli.js --help
          node dist/cli.js list

      - name: Verify Standalone Swarm Execution Outside Repo Root
        run: |
          CLI_PATH="$(pwd)/packages/vibe-ui-suite/dist/cli.js"
          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"
          node "$CLI_PATH" swarm "Minimalist Tech Blog" --json

  nextjs-starter-build:
    name: Next.js 15 & TypeScript 5 Build Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        working-directory: examples/nextjs-starter
        run: npm ci

      - name: Run TypeScript & Next.js Build
        working-directory: examples/nextjs-starter
        run: npm run build

  browser-runtime-evals:
    name: Headless Playwright Browser Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Playwright & Chromium
        run: |
          pip install playwright beautifulsoup4 jsonschema
          playwright install --with-deps chromium

      - name: Run Playwright Browser Runtime Verification
        run: python evals/run_evals.py --browser
