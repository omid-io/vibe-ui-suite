name: CI Audit & Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals-and-schema:
    name: Python WCAG & JSON Schema Evals
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install beautifulsoup4 jsonschema

      - name: Run Vibe UI Automated Verification (Human Readable)
        run: python evals/run_evals.py

      - name: Run Vibe UI Automated Verification (Machine-Readable JSON Mode)
        run: python evals/run_evals.py --json

      - name: Run BM25 & Design Intelligence Engine Self-Tests
        run: python vibe_core/search_engine.py

      - name: Run Schema & Design Genome Validation
        run: python scripts/validate_schemas.py

      - name: Run Inter-Agent Swarm Contracts Verification
        run: python scripts/test_agent_contracts.py

      - name: Run Evidence Integrity & Runtime Contract Tests
        run: python scripts/test_endgame_runtime.py

      - name: Run Advanced Quality, E2E Smoke & Anti-Slop Test Suite
        run: python scripts/test_advanced_quality.py

  vibe-ui-package-audit:
    name: NPM Packed Consumer & Harness Evidence Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and pack the publishable npm artifact
        working-directory: packages/vibe-ui-suite
        run: |
          npm install
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install static validation dependencies
        run: pip install beautifulsoup4 jsonschema

      - name: Install tarball in an isolated consumer project and run the installed CLI
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(find "$RUNNER_TEMP" -maxdepth 1 -name 'vibe-ui-suite-*.tgz' -print -quit)"
          test -n "$TARBALL"
          CONSUMER_DIR="$(mktemp -d)"
          cd "$CONSUMER_DIR"
          npm init -y
          npm install "$TARBALL"
          ./node_modules/.bin/vibe-ui-suite --help
          ./node_modules/.bin/vibe-ui-suite list
          ./node_modules/.bin/vibe-ui-suite swarm "Minimalist Tech Blog" --output swarm_output.html --json > swarm-result.json
          test -s ./swarm_output.html
          BEFORE_SHA="$(sha256sum swarm_output.html | cut -d ' ' -f 1)"
          mkdir -p .vibe
          printf '{}' > .vibe/browser-evidence.json
          ./node_modules/.bin/vibe-ui-suite swarm "Minimalist Tech Blog" --output swarm_output.html --verify-existing --browser-evidence .vibe/browser-evidence.json --json > verify-existing-result.json
          AFTER_SHA="$(sha256sum swarm_output.html | cut -d ' ' -f 1)"
          test "$BEFORE_SHA" = "$AFTER_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("swarm-result.json").read_text(encoding="utf-8"))
          assert result.get("artifact_path"), "Missing artifact_path in CLI JSON"
          assert Path(result["artifact_path"]).is_file(), "Artifact path does not exist"
          report = result.get("evaluation_report", {})
          assert "wcag_contrast_status" in report, "Evidence status fields missing"
          assert "screenshot_status" in report, "Screenshot evidence status missing"
          assert result.get("status") == "ACCEPTABLE_WITH_NOTES", "Missing harness browser evidence must never be reported as accepted"
          request = result.get("browser_evidence_request", {})
          assert request.get("schema_version") == "vibe.browser-evidence/v1"
          assert [vp["width"] for vp in request.get("required_viewports", [])] == [390, 768, 1440]
          final = json.loads(Path("verify-existing-result.json").read_text(encoding="utf-8"))
          assert final.get("verify_existing") is True, "Verify-existing mode was not used"
          assert final.get("status") == "ACCEPTABLE_WITH_NOTES", "Malformed browser evidence must not pass"
          assert final.get("screenshot_audit", {}).get("overall_status") == "NOT_EVALUATED"
          print("Verified packed npm install, browser request, stale-report fail-closed behavior, and no-regeneration SHA stability.")
          PY

  nextjs-starter-build:
    name: Next.js 15 & TypeScript 5 Build Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        working-directory: examples/nextjs-starter
        run: npm ci

      - name: Run TypeScript & Next.js Build
        working-directory: examples/nextjs-starter
        run: npm run build

